server:
  port: 8082

spring:
  application:
    name: spring-boot-essentials-jpa

  datasource:
    url: jdbc:postgresql://localhost:5432/gym
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE